<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Soundscape — Free Music Player</title>
    <meta name="description" content="Soundscape: free full-length music from open catalogues (Audius, Jamendo, Internet Archive), live radio, your own files, and optional Spotify library sync." />
    <meta property="og:title" content="Soundscape — Free Music Player" />
    <meta property="og:description" content="Free full-length music from open catalogues, live radio, your own files, and optional Spotify library sync." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Fonts are SELF-HOSTED (see src/main.tsx) — Plus Jakarta Sans and Material Symbols
      Outlined are bundled, not fetched from Google Fonts. A CDN-hosted icon font breaks the
      entire UI whenever that host is blocked, throttled or serving a bot interstitial:
      every icon degrades to its raw ligature text. Self-hosting keeps icons working
      offline and lets production CSP stay font-src 'self'.
    -->
    <!--
      Spotify's Web Playback SDK is OPTIONAL and loaded lazily from JS only when a Spotify
      session exists (see audioPlayer.ensureSpotifySdk). Keeping it out of this document lets
      production CSP stay strict: no inline scripts, no third-party frames unless needed.
    -->
  </head>
  <body class="bg-[#131313] text-[#e5e2e1] min-h-screen flex flex-col antialiased selection:bg-[#53e076] selection:text-[#003914]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
